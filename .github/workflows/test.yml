name: 🧪 Test

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional jest arguments to select tests"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "🧪 Test: (Node: ${{ matrix.node }})"
    strategy:
      fail-fast: false
      matrix:
        node:
          - 16
          - 18

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3.0.0

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          check-latest: true
          node-version: ${{ matrix.node }}

      - name: Disable GitHub Actions Annotations
        run: |
          echo "::remove-matcher owner=tsc::"
          echo "::remove-matcher owner=eslint-compact::"
          echo "::remove-matcher owner=eslint-stylish::"

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🏗 Build
        run: pnpm build

      - name: 🔬 Lint
        run: pnpm lint

      - name: 🧪 Run tests
        run: pnpm test ${{ inputs.test-filter }}

      - name: Check bundle size
        run: pnpm size

      - name: 📦 Pack @remix-run/router
        if: matrix.node == 18
        run: |
          cd packages/router && pnpm pack --pack-destination $GITHUB_WORKSPACE/seal-out
          mv $GITHUB_WORKSPACE/seal-out/remix-run-router-1.23.0.tgz $GITHUB_WORKSPACE/seal-out/router-1.23.0.tgz

      - name: ⬆️ Upload tarball
        if: matrix.node == 18
        uses: actions/upload-artifact@v4
        with:
          name: router-tgz
          path: seal-out/*.tgz
          if-no-files-found: error
